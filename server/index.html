<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Usage Limits</title>
<style>
  :root {
    --bg: #0b0f14; --card: #131a23; --line: rgba(255,255,255,.07);
    --text: #e8eef5; --muted: #8a96a3;
    --green: #2ee65d; --amber: #ffd60a; --red: #ff453d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; padding: 18px;
  }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .head h1 { font-size: 17px; font-weight: 800; letter-spacing: .4px; margin: 0; }
  .updated { font-size: 11px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px;
  }
  .card h2 { font-size: 13px; font-weight: 800; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--green); } .dot.stale { background: var(--amber); } .dot.err { background: var(--red); }
  .bar-row { margin: 12px 0; }
  .bar-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; margin-bottom: 5px; }
  .bar-label { color: var(--muted); font-weight: 600; }
  .bar-pct { font-weight: 800; font-variant-numeric: tabular-nums; }
  .track { height: 12px; border-radius: 7px; background: rgba(255,255,255,.06); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(7,12,20,.5); }
  .fill { height: 100%; border-radius: 7px; transition: width .5s ease, background .3s ease; }
  .bar-sub { font-size: 10.5px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .meta-line { font-size: 10px; color: var(--muted); margin-top: 8px; opacity: .7; font-variant-numeric: tabular-nums; }
  .err-msg { font-size: 11px; color: var(--red); margin-top: 8px; }
</style>
</head>
<body>
  <div class="head">
    <h1>Usage Limits</h1>
    <span class="updated" id="updated">—</span>
  </div>
  <div class="grid">
    <div class="card" id="card-claude">
      <h2><span class="dot" id="dot-claude"></span>Claude <span style="color:var(--muted);font-weight:600">· Pro</span></h2>
      <div id="bars-claude"></div>
      <div id="poll-cost" class="meta-line"></div>
    </div>
    <div class="card" id="card-codex">
      <h2><span class="dot" id="dot-codex"></span>Codex</h2>
      <div id="bars-codex"></div>
    </div>
  </div>

<script>
let lastState = null;

function colorFor(pct) {
  if (pct >= 80) return "var(--red)";
  if (pct >= 50) return "var(--amber)";
  return "var(--green)";
}

function fmtCountdown(resetUnix) {
  if (!resetUnix) return "";
  const secs = resetUnix - Math.floor(Date.now() / 1000);
  if (secs <= 0) return "Resets now";
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  if (h >= 24) { const d = Math.floor(h / 24); return `Resets in ${d}d ${h % 24}h`; }
  if (h >= 1) return `Resets in ${h}h ${m}m`;
  return `Resets in ${m}m`;
}

function barHtml(label, win) {
  const pct = Math.max(0, Math.min(100, Number(win.used_pct || 0)));
  return `
    <div class="bar-row">
      <div class="bar-top">
        <span class="bar-label">${label}</span>
        <span class="bar-pct">${pct.toFixed(0)}%</span>
      </div>
      <div class="track"><div class="fill" style="width:${pct}%;background:${colorFor(pct)}"></div></div>
      <div class="bar-sub" data-reset="${win.reset || 0}">${fmtCountdown(win.reset)} · ${pct.toFixed(0)}% used</div>
    </div>`;
}

function renderTool(toolKey, data) {
  const dot = document.getElementById("dot-" + toolKey);
  const bars = document.getElementById("bars-" + toolKey);
  if (!data || !data.ok) {
    dot.className = "dot err";
    bars.innerHTML = `<div class="err-msg">${(data && data.error) || "no data"}</div>`;
    return;
  }
  dot.className = "dot " + (data.stale ? "stale" : "ok");
  bars.innerHTML = barHtml("5 hours", data.h5 || {}) + barHtml("Week (7 days)", data.week || {});
  if (toolKey === "codex" && data.source_age != null) {
    const s = data.source_age;
    const ageStr = s < 3600 ? `${Math.floor(s / 60)}m`
                 : s < 86400 ? `${Math.floor(s / 3600)}h`
                 : `${Math.floor(s / 86400)}d`;
    bars.innerHTML += `<div class="meta-line">Last session ${ageStr} ago · 0% = window expired</div>`;
  }
}

function render(state) {
  renderTool("claude", state.claude);
  renderTool("codex", state.codex);
  const ageS = state.updated ? Math.max(0, Math.floor(Date.now() / 1000) - state.updated) : null;
  document.getElementById("updated").textContent =
    ageS === null ? "—" : `updated ${ageS < 60 ? ageS + "s" : Math.floor(ageS / 60) + "m"} ago`;
  const pollCostEl = document.getElementById("poll-cost");
  if (pollCostEl) {
    pollCostEl.textContent = state.poll_cost_week_pct != null
      ? `1 poll ≈ ${state.poll_cost_week_pct.toFixed(5)}% of the week`
      : "Poll cost: calculated on next poll (5 min)";
  }
}

// Keep countdowns ticking locally every second (without a new fetch)
function tickCountdowns() {
  document.querySelectorAll(".bar-sub").forEach((el) => {
    const reset = Number(el.dataset.reset || 0);
    const pctTxt = el.textContent.split("·")[1] || "";
    el.textContent = fmtCountdown(reset) + " ·" + pctTxt;
  });
  if (lastState && lastState.updated) {
    const ageS = Math.max(0, Math.floor(Date.now() / 1000) - lastState.updated);
    document.getElementById("updated").textContent =
      `updated ${ageS < 60 ? ageS + "s" : Math.floor(ageS / 60) + "m"} ago`;
  }
}

async function poll() {
  try {
    const r = await fetch("/state.json", { cache: "no-store" });
    lastState = await r.json();
    render(lastState);
  } catch (e) { /* server briefly unreachable - retry on next poll */ }
}

poll();
setInterval(poll, 20000);
setInterval(tickCountdowns, 1000);
</script>
</body>
</html>
